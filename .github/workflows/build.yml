name: Build GKI Kernel

env:
  TZ: Asia/Shanghai
  KERNEL_VERSION: '6.12'
  KERNEL_NAME: android16-5-ga8f88ad96df3-ab13929693-4k

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-mark hold firefox libc-bin
          sudo apt purge -y man-db
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libdw-dev

      - name: Fetch toolchains
        run: |
          BASE=https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225
          mkdir -p clang19 rust
          aria2c -s16 -x16 -k1M $BASE/clang-r536225.zip -o clang.zip &
          aria2c -s16 -x16 -k1M $BASE/rust.zip -o rust.zip &
          aria2c -s16 -x16 -k1M $BASE/build-tools.zip -o build-tools.zip &
          wait
          unzip -q clang.zip -d clang19
          unzip -q rust.zip -d rust
          unzip -q build-tools.zip
          rm -f clang.zip rust.zip build-tools.zip

      - name: Prepare source
        run: |
          sed -i 's/ -dirty//g' scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' scripts/setlocalversion
          sed -i "\$s|echo \"\\\$res\"|echo \"-${{ env.KERNEL_NAME }}\"|" scripts/setlocalversion
          sed -i 's/${scm_version}//' scripts/setlocalversion
          sed -i 's/check_defconfig//' build.config.gki

          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_HEADERS_INSTALL=n
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_RUST=y
          CONFIG_ANDROID_BINDER_IPC_RUST=m
          EOF

      - name: Build
        run: |
          WORKDIR=$(pwd)
          export PATH="$WORKDIR/clang19/bin:$WORKDIR/build-tools/bin:$WORKDIR/rust/bin:$PATH"
          export RUSTC=rustc BINDGEN=bindgen
          export LIBCLANG_PATH="$WORKDIR/clang19/lib"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1 LLVM_IAS=1
          export HOSTCC=clang CC=clang
          export LD=ld.lld HOSTLD=ld.lld
          export AR=llvm-ar NM=llvm-nm AS=clang
          export READELF=llvm-readelf OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump OBJSIZE=llvm-size STRIP=llvm-strip

          RP=$(pwd -P)
          export KCFLAGS="-fdebug-prefix-map=$RP=. -fmacro-prefix-map=$RP=. -ffile-prefix-map=$RP=. \
            -no-canonical-prefixes -O2 -pipe -Wno-error -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc &
          source ./_setup_env.sh 2>/dev/null || true

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld OBJCOPY=llvm-objcopy O=out gki_defconfig
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld OBJCOPY=llvm-objcopy O=out Image

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7